# Release configuration (goreleaser v2). Triggered by the release workflow on
# v* tags: static binaries for the six supported platforms, archives with the
# docs a user needs offline, and a checksums file. The container image is
# built and pushed by the same workflow from the Dockerfile (amd64-only — the
# MySQL APT repo ships no arm64 client), not by goreleaser.
version: 2

project_name: dbferry

builds:
  - main: ./cmd/dbferry
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - docs/restore.md
      - docs/connections.md
      - docs/operations.md

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  # Everything before v1 is a pre-release. goreleaser's `auto` only reacts to
  # tag suffixes (-rc1 etc.), not to the 0.x major — so say it explicitly and
  # flip this at v1.0.0.
  prerelease: "true"
  footer: |
    **Verify your download**: `shasum -a 256 -c checksums.txt`

    Container image: `docker pull ghcr.io/dbferry/dbferry:{{ .Tag }}` (linux/amd64,
    bundles pg_dump 14–18 and the MySQL client).

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to ghcr.io

jobs:
  goreleaser:
    name: binaries + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs tags + history for the changelog
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: push ghcr.io/dbferry/dbferry
    runs-on: ubuntu-latest # amd64 — the MySQL APT repo ships no arm64 client
    steps:
      - uses: actions/checkout@v7
      - name: log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE=ghcr.io/dbferry/dbferry
          docker build --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:$GITHUB_REF_NAME" version
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"
